name: Escáner Semanal de Novedades y Bugs de Business Central

on:
  schedule:
    # Se ejecuta todos los lunes a las 07:00 UTC (08:00 o 09:00 hora de España)
    - cron: '0 7 * * 1'
  workflow_dispatch: # Permite lanzarlo manualmente cuando quieras desde GitHub Actions

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar Escáner Profundo (Microsoft Learn + Bugs CU + YouTube / Blogs)
        id: scanner
        run: |
          python scripts/scanner_novedades_bc.py

      - name: Enviar Informe por Correo Corporativo
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/enviar_correo_semanal.py

      - name: Confirmar y Publicar Cambios en GitHub si hay Novedades
        run: |
          git config --global user.name "AUBA Bot"
          git config --global user.email "bot@aubadcs.com"
          git add data/ index.html cuaderno_novedades_bc.html
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en los datos ni en el HTML."
          else
            git commit -m "chore(auto): actualización semanal de novedades, parches y vídeos oficiales [skip ci]"
            git push
          fi
